{% extends "platform/base.html" %}

{% block title %}Login — AI Software Company{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
    <h1 class="text-2xl font-bold mb-2">Sign in</h1>
    <p class="text-sm text-gray-600 mb-6">
        Login required to submit builds, view jobs, and approve deployments.
    </p>

    <form method="post" action="/login" class="space-y-4 bg-gray-50 p-6 rounded border border-gray-200">
        <!-- CSRF token (Section 8) — generated server-side and embedded in the form -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

        <div>
            <label for="username" class="block text-sm font-medium mb-1">Username</label>
            <input id="username" name="username" type="text" required autocomplete="username"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
            <label for="password" class="block text-sm font-medium mb-1">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <button type="submit"
                class="btn w-full bg-blue-600 hover:bg-blue-700 text-white rounded px-4 py-2 font-medium">
            Sign in
        </button>
    </form>

    <p class="text-xs text-gray-500 mt-4">
        Signup is disabled. Users are created by an administrator.
    </p>
</div>
{% endblock %}
